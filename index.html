<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HunterXBaking</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
background:#f5f5f7;
color:#1d1d1f;
}

header{
background:white;
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.logo{
font-size:28px;
font-weight:700;
}

nav a{
text-decoration:none;
color:#1d1d1f;
margin-left:20px;
}

.hero{
background:white;
text-align:center;
padding:100px 20px;
}

.hero h1{
font-size:48px;
margin-bottom:15px;
}

.hero p{
font-size:18px;
color:#666;
}

.btn{
display:inline-block;
margin-top:20px;
padding:14px 28px;
background:black;
color:white;
text-decoration:none;
border-radius:30px;
}

.products{
padding:50px 8%;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.card{
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.content{
padding:20px;
}

.price{
font-size:22px;
font-weight:bold;
margin:15px 0;
}

.buy{
width:100%;
padding:12px;
border:none;
background:black;
color:white;
border-radius:10px;
}

footer{
text-align:center;
padding:30px;
color:#888;
}
</style>
</head>

<body>

<header>
<div class="logo">HunterXBaking</div>

<nav>
<a href="#">Trang chủ</a>
<a href="#">Sản phẩm</a>
<a href="#">Liên hệ</a>
</nav>
</header>

<section class="hero">
<h1>HunterXBaking Store</h1>
<p>Chào mừng đến với cửa hàng của chúng tôi</p>
<a href="#" class="btn">Khám phá ngay</a>
</section>

<section class="products">

<div class="card">
<img src="https://picsum.photos/500/300?1">
<div class="content">
<h3>Sản phẩm 1</h3>
<p>Mô tả sản phẩm</p>
<div class="price">100.000₫</div>
<button class="buy">Mua ngay</button>
</div>
</div>

<div class="card">
<img src="https://picsum.photos/500/300?2">
<div class="content">
<h3>Sản phẩm 2</h3>
<p>Mô tả sản phẩm</p>
<div class="price">200.000₫</div>
<button class="buy">Mua ngay</button>
</div>
</div>

<div class="card">
<img src="https://picsum.photos/500/300?3">
<div class="content">
<h3>Sản phẩm 3</h3>
<p>Mô tả sản phẩm</p>
<div class="price">300.000₫</div>
<button class="buy">Mua ngay</button>
</div>
</div>

</section>

<footer>
© 2026 HunterXBaking
</footer>

</body>
</html>
