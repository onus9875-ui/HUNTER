<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Dịch Vụ Của Tôi</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* CSS đơn giản cho thẻ card */
        .products { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
        .card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; width: 250px; }
        .buy { background-color: #007bff; color: white; border: none; padding: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Danh sách dịch vụ</h1>
    <section class="products" id="services-container">
        Đang tải dữ liệu...
    </section>

    <script>
        // 1. Thay URL và KEY từ phần Settings > API của Supabase
        const SUPABASE_URL = 'https://ihfgfalvhtivipvvzvbp.supabase.co/rest/v1/';
        const SUPABASE_KEY = 'sb_publishable_wRV6-Ldmnurgkwfhi43xjw_5MY-q-es';
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 2. Hàm lấy dữ liệu và hiển thị
        async function loadServices() {
            const { data, error } = await supabase.from('products').select('*');
            
            const container = document.getElementById('services-container');
            
            if (error) {
                container.innerHTML = "Có lỗi xảy ra: " + error.message;
                return;
            }

            if (data.length === 0) {
                container.innerHTML = "Chưa có dịch vụ nào.";
                return;
            }

            container.innerHTML = data.map(item => `
                <div class="card">
                    <h3>${item.title}</h3>
                    <p>${item.description}</p>
                    <button class="buy">Xem dịch vụ</button>
                </div>
            `).join('');
        }

        // 3. Chạy hàm khi trang web tải xong
        loadServices();
    </script>
</body>
</html>
