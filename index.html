<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>MMO Shop Pro</title>

<style>
body{
  margin:0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI";
  background:#0a0a0f;
  color:#fff;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  padding:15px 25px;
  background:rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
}

.logo{
  font-weight:bold;
  color:#00ffcc;
}

/* LOGIN */
.login-box{
  width:320px;
  margin:100px auto;
  background:rgba(255,255,255,0.06);
  padding:20px;
  border-radius:15px;
  text-align:center;
}

input{
  width:90%;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:10px;
}

/* BUTTON */
button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#0071e3;
  color:white;
  cursor:pointer;
  transition:0.2s;
}
button:hover{
  background:#0a84ff;
}

/* SHOP */
.container{
  display:none;
  padding:20px;
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(240px,1fr));
  gap:15px;
}

.card{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:15px;
  padding:15px;
  transition:0.2s;
}
.card:hover{
  transform:translateY(-5px);
}

.price{
  color:#00ffcc;
  margin:5px 0;
}

/* TOP INFO */
.top-info{
  display:flex;
  justify-content:space-between;
  padding:10px 20px;
  color:#aaa;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">⚡ MMO SHOP PRO</div>
  <div id="userInfo">Chưa đăng nhập</div>
</div>

<!-- LOGIN -->
<div class="login-box" id="loginBox">
  <h2>Đăng nhập</h2>
  <input id="username" placeholder="Nhập tên user">
  <button onclick="login()">Vào shop</button>
</div>

<!-- TOP -->
<div class="top-info" id="topInfo" style="display:none;">
  <div>💰 <span id="balance">0</span>đ</div>
  <div><input id="money" placeholder="Nạp tiền" style="width:120px;"> <button onclick="deposit()" style="width:auto;">+</button></div>
</div>

<!-- SHOP -->
<div class="container" id="shop">

  <div class="card">
    <h3>🔥 Facebook Dame</h3>
    <div class="price">50.000đ</div>
    <button onclick="buy('Facebook',50000)">Mua ngay</button>
  </div>

  <div class="card">
    <h3>💬 Zalo Tháng/Năm</h3>
    <div class="price">100.000đ</div>
    <button onclick="buy('Zalo',100000)">Mua ngay</button>
  </div>

  <div class="card">
    <h3>🎵 TikTok 500-1K FL</h3>
    <div class="price">150.000đ</div>
    <button onclick="buy('TikTok',150000)">Mua ngay</button>
  </div>

</div>

<script>
let user="";
let balance=0;

function login(){
  user=document.getElementById("username").value;
  if(!user) return alert("Nhập user");

  document.getElementById("loginBox").style.display="none";
  document.getElementById("shop").style.display="grid";
  document.getElementById("topInfo").style.display="flex";

  document.getElementById("userInfo").innerText="👤 "+user;

  load();
}

function deposit(){
  let m=parseInt(document.getElementById("money").value);
  if(!m||m<=0) return alert("Sai tiền");

  balance+=m;
  save();
}

function buy(name,price){
  if(balance<price) return alert("Không đủ tiền");

  balance-=price;
  alert("Đã mua: "+name);
  save();
}

function save(){
  localStorage.setItem("balance",balance);
  document.getElementById("balance").innerText=balance;
}

function load(){
  balance=parseInt(localStorage.getItem("balance"))||0;
  document.getElementById("balance").innerText=balance;
}
</script>

</body>
</html>
