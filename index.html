<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>MMO Shop Pro</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI";
  background:#0a0a0f;
  color:white;
}

/* LOGIN */
.login{
  width:320px;
  margin:100px auto;
  background:rgba(255,255,255,0.06);
  padding:20px;
  border-radius:16px;
  text-align:center;
}

input{
  width:90%;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:10px;
}

/* BUTTON */
button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#0071e3;
  color:white;
  cursor:pointer;
}

/* HEADER */
.header{
  display:none;
  justify-content:space-between;
  padding:15px 20px;
  background:rgba(255,255,255,0.05);
}

/* SHOP */
.container{
  display:none;
  padding:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
}

.card{
  background:rgba(255,255,255,0.06);
  border-radius:15px;
  padding:15px;
  border:1px solid rgba(255,255,255,0.1);
}

.price{
  color:#00ffcc;
}

/* QR */
.qr{
  text-align:center;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="loginBox">
  <h2>Đăng nhập</h2>
  <input id="user" placeholder="Tên user">
  <button onclick="login()">Vào shop</button>
</div>

<!-- HEADER -->
<div class="header" id="header">
  <div>👤 <span id="username"></span></div>
  <div>💰 <span id="balance">0</span>đ</div>
</div>

<!-- SHOP -->
<div class="container" id="shop">

  <div class="card">
    <h3>🔥 Facebook Dame</h3>
    <div class="price">150.000đ</div>
    <button onclick="buy('Facebook',50000)">Mua</button>
  </div>

  <div class="card">
    <h3>💬 Zalo Tháng/Năm</h3>
    <div class="price">100.000đ</div>
    <button onclick="buy('Zalo',100000)">Mua</button>
  </div>

  <div class="card">
    <h3>🎵 TikTok 500-1K FL</h3>
    <div class="price">150.000đ</div>
    <button onclick="buy('TikTok',150000)">Mua</button>
  </div>

  <!-- NẠP TIỀN -->
  <div class="card qr">
    <h3>💰 Nạp tiền</h3>

    <img id="qr" width="200">

    <p>Nội dung: <b id="code"></b></p>
  </div>

</div>

<script>
let user="";
let balance=0;

function login(){
  user=document.getElementById("user").value;
  if(!user) return alert("Nhập user");

  document.getElementById("loginBox").style.display="none";
  document.getElementById("shop").style.display="grid";
  document.getElementById("header").style.display="flex";

  document.getElementById("username").innerText=user;

  // tạo mã nạp tiền riêng
  let code="USER"+Math.floor(Math.random()*9999);

  document.getElementById("code").innerText=code;

  // QR VietQR (demo)
  document.getElementById("qr").src=
  "https://img.vietqr.io/image/mbbank-123456789-compact.png?addInfo="+code+"&amount=100000";

  load();
}

function buy(name,price){
  if(balance<price){
    alert("Không đủ tiền");
    return;
  }

  balance-=price;
  save();
  alert("Đã mua: "+name);
}

function load(){
  balance=parseInt(localStorage.getItem("balance"))||0;
  document.getElementById("balance").innerText=balance;
}

function save(){
  localStorage.setItem("balance",balance);
  document.getElementById("balance").innerText=balance;
}
</script>

</body>
</html>
