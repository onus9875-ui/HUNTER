<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HunterXBaking</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
background:#f5f5f7;
color:#1d1d1f;
}

header{
background:#fff;
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.05);
position:sticky;
top:0;
z-index:100;
}

.logo{
font-size:28px;
font-weight:700;
}

nav a{
text-decoration:none;
color:#1d1d1f;
margin-left:20px;
font-weight:500;
}

.hero{
background:#fff;
padding:100px 20px;
text-align:center;
}

.hero h1{
font-size:50px;
margin-bottom:15px;
}

.hero p{
font-size:18px;
color:#666;
}

.btn{
display:inline-block;
margin-top:20px;
padding:14px 30px;
background:#000;
color:#fff;
text-decoration:none;
border-radius:30px;
}

.products{
padding:60px 8%;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
}

.card{
background:#fff;
border-radius:20px;
padding:25px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card h3{
font-size:24px;
margin-bottom:10px;
}

.card p{
color:#666;
margin-bottom:20px;
}

.buy{
width:100%;
padding:12px;
background:#000;
color:#fff;
border:none;
border-radius:10px;
cursor:pointer;
}

footer{
text-align:center;
padding:30px;
color:#888;
}
</style>
</head>

<body>

<header>
<div class="logo">HunterXBaking</div>
<div id="userBox">Chưa đăng nhập</div>
</header>

<section class="hero">
<h1>HunterXBaking Store</h1>
<p>Dịch vụ trực tuyến nhanh chóng và tiện lợi</p>

<!-- LOGIN -->
<div id="loginBox">
  <input id="user" placeholder="Nhập username" style="padding:10px;border-radius:10px;">
  <button onclick="login()" class="btn">Đăng nhập</button>
</div>

<div id="wallet" style="margin-top:15px;font-weight:bold;"></div>
</section>

<section class="products">

<div class="card">
<h3>📱 Mua Zalo</h3>
<p>Giá: 100.000đ</p>
<button class="buy" onclick="buy('Zalo',100000)">Mua ngay</button>
</div>

<div class="card">
<h3>🔥 Dame FB</h3>
<p>Giá: 50.000đ</p>
<button class="buy" onclick="buy('Facebook',50000)">Mua ngay</button>
</div>

<div class="card">
<h3>🎵 TikTok Nick</h3>
<p>Giá: 150.000đ</p>
<button class="buy" onclick="buy('TikTok',150000)">Mua ngay</button>
</div>

<!-- NẠP TIỀN -->
<div class="card">
<h3>💰 Nạp tiền</h3>
<input id="money" placeholder="Nhập số tiền">
<button class="buy" onclick="deposit()">Nạp tiền</button>

<p id="qrText"></p>
</div>

</section>

<footer>
© 2026 HunterXBaking
</footer>

<script>
let user = "";
let balance = 0;

// LOGIN
function login(){
  user = document.getElementById("user").value;
  if(!user) return alert("Nhập username");

  document.getElementById("userBox").innerText = "👤 " + user;

  balance = parseInt(localStorage.getItem(user+"_balance")) || 0;

  updateWallet();
}

// UPDATE UI
function updateWallet(){
  document.getElementById("wallet").innerText =
  "💰 Số dư: " + balance + "đ";
}

// MUA
function buy(name, price){
  if(balance < price){
    alert("Không đủ tiền!");
    return;
  }

  balance -= price;
  save();

  alert("Đã mua: " + name);
}

// NẠP TIỀN (QR DEMO)
function deposit(){
  let money = parseInt(document.getElementById("money").value);
  if(!money || money <= 0) return alert("Sai số tiền");

  document.getElementById("qrText").innerText =
  "Chuyển khoản nội dung: " + user;

  // giả lập cộng tiền
  balance += money;
  save();

  alert("Nạp thành công (demo)");
}

// SAVE
function save(){
  localStorage.setItem(user+"_balance", balance);
  updateWallet();
}
</script>

</body>
